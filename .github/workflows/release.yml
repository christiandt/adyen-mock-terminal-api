name: Release

on:
  push:
    tags:
      - 'v*'
  # From the Actions tab. Without a tag it is a dry run: it builds everything and releases
  # nothing. With an existing tag it builds that tag and creates or completes its release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (empty for a dry run)
        required: false
        default: ''

jobs:
  desktop:
    name: Build desktop app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: desktop-linux
          - os: macos-latest
            artifact: desktop-macos
          - os: windows-latest
            artifact: desktop-windows

    steps:
      - uses: actions/checkout@v4
        with:
          # Only an existing tag resolves: a branch name fails the run.
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # The server's dependencies, bundled into the app.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # Runs when builds fail or are cancelled too (e.g. no macOS runner was free): the release
    # gets what was built, and re-running the failed jobs later adds the rest to it.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    needs: [desktop]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or complete the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing was built, so there is nothing to release."
            exit 1
          fi
          missing=()
          for name in desktop-linux desktop-macos desktop-windows; do
            [ -d "artifacts/$name" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Not built in this run: ${missing[*]}. Re-run the failed jobs to add them to the release."
            echo "Not built in this run: \`${missing[*]}\`. Re-run the failed jobs to add them to release $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # The release exists (an earlier, partial run): add or replace files.
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            # --verify-tag: never create a tag, which would point elsewhere than the code
            # these files were built from.
            gh release create "$TAG" --repo "$REPO" --title "Release $TAG" --generate-notes --verify-tag "${files[@]}"
          fi
